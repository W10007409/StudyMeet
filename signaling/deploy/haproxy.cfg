# 443 하나를 TURN over TLS 와 시그널링 WSS 가 나눠 쓴다.
#
# 왜 이렇게까지 하나: 사내망은 보통 443 외의 포트와 UDP를 막는다. 선생님이 실제로
# 붙을 수 있는지를 검증하는 것이 목적이므로, 둘 중 하나라도 다른 포트로 옮기면
# 측정 대상 조건이 사라진다. 그래서 SNI 로만 가른다.
#
# 두 백엔드 모두 TLS 를 스스로 종단한다 (passthrough). haproxy 는 ClientHello 의
# SNI 만 들여다보고 TCP 바이트를 그대로 넘긴다.

global
    log stdout format raw local0
    maxconn 4096
    # 443 바인딩은 루트로만 되므로 컨테이너를 루트로 띄운다(docker-compose.yml).
    # 바인딩이 끝나면 여기서 권한을 버린다 — 루트로 계속 돌지 않는다.
    user  haproxy
    group haproxy

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    # TURN 제어 연결은 통화 내내 열려 있다. 짧게 잡으면 통화 중간에 끊긴다.
    timeout client  1h
    timeout server  1h

frontend tls_443
    bind :443

    # ClientHello 가 도착할 때까지 기다린다. 이게 없으면 SNI 를 읽기 전에 라우팅된다.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl has_sni req.ssl_sni -m found
    acl is_turn req.ssl_sni -i -m beg turn.
    acl is_sig  req.ssl_sni -i -m beg sig.

    use_backend turn_tls if is_turn
    use_backend sig_tls  if is_sig

    # SNI 없이 오는 TLS 는 TURN 으로 보낸다. 브라우저와 libwebrtc 는 항상 SNI 를 보내지만
    # turnutils_uclient 같은 진단 도구는 보내지 않는다. 이걸 nginx 로 흘리면 TLS 는 붙고
    # STUN 요청에 HTTP 응답이 돌아와서 클라이언트가 "Received wrong response method" 만
    # 뱉는다 — 원인이 라우팅이라는 걸 알아채기 어렵다.
    use_backend turn_tls if !has_sni

    default_backend sig_tls

backend turn_tls
    server coturn 127.0.0.1:5349

backend sig_tls
    server nginx 127.0.0.1:8443
