# sig.<도메인> 의 TLS 종단. haproxy 가 SNI 로 이미 골라서 넘겨주므로
# server_name 은 따로 매칭하지 않는다.
#
# 인증서 경로가 고정인 이유: certbot 을 --cert-name studymeet 로 발급하기 때문이다.
# 도메인을 바꿔도 이 경로는 그대로다.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr;

    upstream signaling {
        server 127.0.0.1:8080;
    }

    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;

        ssl_certificate     /etc/letsencrypt/live/studymeet/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/studymeet/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://signaling;
            proxy_http_version 1.1;

            # WebSocket 업그레이드. 이 두 줄이 없으면 시그널링이 조용히 실패한다.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;

            # 수업 시간 내내 열려 있는 연결이다.
            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
        }
    }
}
