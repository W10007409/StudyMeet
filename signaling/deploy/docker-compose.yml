# Phase 0 스파이크용 공개 호스트 구성.
# 태블릿(가정 와이파이)과 선생님 PC(사내망)는 서로에게 직접 도달하지 못한다.
# 양쪽 모두가 닿을 수 있는 유일한 지점이 이 VM이므로, 시그널링과 TURN을 여기에 둔다.
#
# 모든 서비스가 network_mode: host 다. TURN 릴레이는 수십 개의 UDP 포트를 쓰는데,
# 브리지 네트워크에서 포트 범위를 publish하면 포트마다 userland proxy가 붙어 지연이
# 측정값을 오염시킨다. 이 VM은 이 용도 전용이므로 호스트 네트워크를 그대로 쓴다.

services:
  # 시그널링. 평문 HTTP/WS로 루프백에만 응답하고, TLS는 nginx가 벗긴다.
  signaling:
    build:
      context: ..
      dockerfile: deploy/signaling.Dockerfile
    network_mode: host
    environment:
      PORT: "8080"
      HOST: "127.0.0.1"
    restart: unless-stopped

  # sig.<도메인> 의 TLS 종단. WebSocket 업그레이드를 그대로 통과시킨다.
  nginx:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - signaling
    restart: unless-stopped

  # TURN. 제어 채널은 루프백에서만 받고(haproxy가 넘겨준다), 릴레이는 실제
  # 인터페이스에 바인딩해야 상대 피어가 직접 UDP를 보낼 수 있다.
  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    # certbot 의 privkey.pem 은 0600 root 소유인데 이 이미지는 기본이 nobody(65534)다.
    # 그대로 두면 키를 못 읽고 TLS 리스너 없이 떠서, 앱은 443 에 붙었는데 TURN 만
    # 조용히 실패하는 상태가 된다. 인증서 경로 주석(turnserver.conf) 참고.
    user: "0:0"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/letsencrypt:ro
    command: >
      -c /etc/coturn/turnserver.conf
      --user=${TURN_USER}:${TURN_PASS}
      --realm=${TURN_REALM}
      --external-ip=${PUBLIC_IP}/${PRIVATE_IP}
      --relay-ip=${PRIVATE_IP}
    restart: unless-stopped

  # 443 한 포트를 TURN과 시그널링이 나눠 쓴다. SNI로만 가른다.
  # 사내망이 443 외의 포트를 막는 것이 이 구성의 이유이므로, 둘 중 하나를
  # 다른 포트로 옮기면 검증하려던 조건 자체가 사라진다.
  haproxy:
    image: haproxy:3.0-alpine
    network_mode: host
    # 이 이미지는 haproxy 유저로 실행된다. 443 은 1024 미만이라 비루트로는 바인딩할 수
    # 없어서 "cannot bind socket (Permission denied) for [0.0.0.0:443]" 로 재시작만 반복한다.
    # 루트로 띄우고, 바인딩 직후 haproxy.cfg 의 user/group 지시자로 다시 권한을 버린다.
    user: "0:0"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - coturn
      - nginx
    restart: unless-stopped

  # 최초 발급과 갱신 모두 이 서비스로 한다. 평소에는 떠 있지 않다:
  #   docker compose run --rm certbot certonly --standalone -d turn.<도메인> -d sig.<도메인>
  #   docker compose run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    network_mode: host
    volumes:
      - ./certs:/etc/letsencrypt
    profiles:
      - tools
