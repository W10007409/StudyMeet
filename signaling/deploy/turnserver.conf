# coturn 정적 설정. 값이 환경마다 달라지는 항목(자격증명, 공인/사설 IP, 인증서 경로)은
# docker-compose.yml 의 command 에서 .env 로 주입한다. 여기에 자격증명을 적지 않는다.

# 제어 채널은 루프백에서만 받는다. 외부에서 오는 TURN 연결은 전부 haproxy(443)를 거친다.
listening-ip=127.0.0.1
tls-listening-port=5349

# 인증서 경로는 고정이다. certbot 을 --cert-name studymeet 로 발급하기 때문이다.
#
# certbot 이 만드는 privkey.pem 은 0600 root 소유다. coturn 이미지는 기본으로 nobody(65534)
# 로 실행되므로 그대로 두면 키를 못 읽고 다음 경고만 남긴 채 TLS 리스너 없이 뜬다:
#   WARNING: cannot start TLS and DTLS listeners because private key file is not set properly
# 그래서 docker-compose.yml 에서 이 컨테이너만 user: "0:0" 으로 띄운다.
cert=/etc/letsencrypt/live/studymeet/fullchain.pem
pkey=/etc/letsencrypt/live/studymeet/privkey.pem

# 평문 TURN 은 열지 않는다. 사내망 검증이 목적이라 443/TLS 경로만 쓴다.
no-tcp
no-udp

# 릴레이는 실제 인터페이스에 바인딩한다 (relay-ip 는 compose 에서 주입).
# 상대 피어가 직결 후보로 릴레이 주소에 UDP 를 직접 보내는 경로가 여기다.
min-port=49160
max-port=49200

# 장기 자격증명. 스파이크라 사용자 1명을 compose 에서 --user 로 준다.
lt-cred-mech
fingerprint

# 관리용 CLI 는 열지 않는다.
no-cli

# 사설 대역으로의 릴레이를 막는다. 이게 없으면 TURN 서버가 VM 내부망과 클라우드
# 메타데이터(169.254.169.254)를 향한 중계기로 쓰일 수 있다 — 공개 호스트에서는 필수다.
#
# 주의: 양쪽 피어가 모두 relay 후보로만 붙는 경우, 한쪽 할당의 상대 주소가 같은
# 서버의 릴레이 주소가 된다. 클라우드가 hairpin NAT 을 지원하지 않으면 이 조합이
# CHANNEL_BIND 단계에서 403 Forbidden IP 로 실패할 수 있다.
#
# 그때 푸는 방법은 해당 주소를 덮는 denied-peer-ip 줄을 그 주소만 빼도록 좁히는 것이다.
# `allowed-peer-ip` 추가로는 풀리지 않았다 (4.6.3에서 확인). 차단 목록을 통째로 지우면
# 안 된다 — 169.254.169.254 메타데이터 차단이 함께 사라진다.
#
# 루프백 주소는 이 목록과 별개로 항상 막혀 있다. 로컬 검증에서만 --allow-loopback-peers
# 를 붙인다. 공개 VM 에서는 절대 켜지 않는다.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255

# 릴레이 비율 측정에 쓸 로그. 할당(allocation)마다 한 줄씩 남는다.
verbose
log-file=stdout
simple-log
